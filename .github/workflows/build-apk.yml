
            
name: Crear APK NutriFamilia

on:
  workflow_dispatch:
  push:
    branches:
      - principal
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar proyecto
        uses: actions/checkout@v4

      - name: Preparar proyecto Android
        run: |
          mkdir -p android_project
          ZIP_FILE=$(find . -maxdepth 1 -type f -iname "*.zip" | head -1)
          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: No se encontro el archivo ZIP."
            exit 1
          fi
          unzip -q "$ZIP_FILE" -d android_project
          
          SETTINGS_FILE=$(find android_project -type f -name "settings.gradle*" | head -1)
          if [ -n "$SETTINGS_FILE" ]; then
            PROJECT_DIR=$(dirname "$SETTINGS_FILE")
          else
            BUILD_FILE=$(find android_project -type f -name "build.gradle*" | head -1)
            PROJECT_DIR=$(dirname "$BUILD_FILE")
          fi
          
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Corregir duplicados de Kotlin
        run: |
          mkdir -p ~/.gradle
          cat << 'EOF' > ~/.gradle/init.gradle
          allprojects {
              configurations.all {
                  resolutionStrategy.dependencySubstitution {
                      substitute module("org.jetbrains.kotlin:kotlin-stdlib-jdk7") using module("org.jetbrains.kotlin:kotlin-stdlib:1.8.22")
                      substitute module("org.jetbrains.kotlin:kotlin-stdlib-jdk8") using module("org.jetbrains.kotlin:kotlin-stdlib:1.8.22")
                  }
              }
          }
          EOF

      - name: Compilar APK
        run: |
          cd "$PROJECT_DIR"
          gradle assembleDebug

      - name: Guardar APK
        uses: actions/upload-artifact@v4
        with:
          name: NutriFamilia-APK
          path: |
            ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/*.apk
            ${{ env.PROJECT_DIR }}/*/build/outputs/apk/debug/*.apk
