name: Crear APK NutriFamilia

on:
  workflow_dispatch:
  push:
    branches:
      - principal

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar proyecto
        uses: actions/checkout@v4

      - name: Preparar proyecto Android
        run: |
          mkdir -p android_project
          ZIP_FILE=$(find . -maxdepth 1 -type f -iname "*.zip" | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: No se encontró el ZIP del proyecto Android."
            exit 1
          fi

          echo "Usando: $ZIP_FILE"
          unzip -q "$ZIP_FILE" -d android_project

          GRADLEW=$(find android_project -type f -name "gradlew" | head -n 1)

          if [ -z "$GRADLEW" ]; then
            echo "ERROR: No se encontró gradlew dentro del proyecto."
            echo "Contenido del ZIP:"
            find android_project -maxdepth 3 -type f | head -100
            exit 1
          fi

          PROJECT_DIR=$(dirname "$GRADLEW")
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Dar permisos a Gradle
        run: chmod +x "$PROJECT_DIR/gradlew"

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Compilar APK
        run: |
          cd "$PROJECT_DIR"
          ./gradlew assembleDebug --stacktrace

      - name: Localizar APK
        run: |
          APK=$(find "$PROJECT_DIR" -type f -name "*.apk" | head -n 1)

          if [ -z "$APK" ]; then
            echo "ERROR: No se generó ningún APK."
            exit 1
          fi

          echo "APK encontrado: $APK"
          cp "$APK" "$GITHUB_WORKSPACE/NutriFamilia-V2.2-debug.apk"

      - name: Guardar APK
        uses: actions/upload-artifact@v4
        with:
          name: NutriFamilia-V2.2-APK
          path: NutriFamilia-V2.2-debug.apk
