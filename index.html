function dayQuality(p,date=localDate()){
 const t=totals(date,p.id),tg=targets(p);
 let score=50;
 if(t.kcal>0){if(t.kcal<=tg.cal*1.05)score+=8;if(t.kcal<tg.cal*.75)score-=8}

 if(t.sat<=tg.sat)score+=4;
 if(t.c<=tg.carbs)score+=6;

 if(p.pattern==='mediterranean'||p.pattern==='medlowcarb'||p.pattern==='longevity'){if(t.f>=1)score+=3}

async function analyzeTextMeal(){let text=document.getElementById('mealtext').value.trim();if(!text)return;let prompt=`Convertí esta descripción de comida en JSON válido y nada más: {"items":[{"name":"nombre simple del alimento","grams":100,"quantity":null,"unit":"g","confidence":0.8}],"meal_type":"Almuerzo","notes":""}. No inventes ingredientes que no estén mencionados. Para alimentos expresados por porción/unidad, completá quantity solo si la cantidad está indicada o puede estimarse claramente; no conviertas gramos a porciones sin una base explícita. Si la cantidad no está clara, marcá confidence baja y dejá quantity/grams sin una falsa precisión. Descripción: ${text}`;try{closeModal();openModal({title:'🤖 Analizando comida…',body:'<div class="empty">Identificando alimentos y cantidades…</div>'});let raw=await callAI(prompt);let clean=raw.replace(/```json|```/g,'').trim();let json=JSON.parse(clean);if(!json.items||!Array.isArray(json.items))throw new Error('La IA no devolvió una lista válida de alimentos.');json.items=json.items.map(x=>({...x,confidence:Math.min(1,Math.max(0,Number(x.confidence)||0.5))}));showAIResult(json,text)}catch(e){openModal({title:'No pude analizar',body:`<div class="notice">${esc(e.message)}<br>Probá indicar cantidades o registrar manualmente.</div><button onclick="closeModal()">Cerrar</button>`})}}
function resolveFood(name){let fs=allFoods(),keys=Object.keys(fs),n=(name||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').trim();const aliases={'palta':'Palta','aguacate':'Palta','huevo duro':'Huevo hervido','huevo cocido':'Huevo hervido','pollo grillado':'Pechuga de pollo a la plancha','pollo a la parrilla':'Pechuga de pollo a la plancha','pollo a la plancha':'Pechuga de pollo a la plancha','bife':'Bife de carne magra','carne vacuna':'Carne vacuna magra','fideos':'Pasta cocida','tallarines':'Pasta cocida','zapallito':'Zapallito','zucchini':'Zapallito','morron':'Morrón','pimiento':'Morrón'};if(aliases[n]&&fs[aliases[n]])return aliases[n];let best=keys.find(k=>k.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'')===n);if(best)return best;let toks=n.split(/\s+/).filter(x=>x.length>2);return keys.find(k=>{let kk=k.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'');return kk.includes(n)||n.includes(kk)||toks.every(t=>kk.includes(t))})||null}
function showAIResult(data,original){const items=(data.items||[]).map(x=>{const food=resolveFood(x.name),f=food?allFoods()[food]:null,qty=f?.unitMode==='portion'?Number(x.quantity||x.portions):Number(x.grams);return {...x,food,usable:!!f&&Number.isFinite(qty)&&qty>0,quantity:qty}});const known=items.filter(x=>x.usable);const sums={kcal:0,p:0,c:0,f:0,fib:0};known.forEach(x=>{const e=calcEntryFromFood(x.food,x.quantity,{estimate:true,confidence:Number(x.confidence)||.5});if(e){sums.kcal+=e.kcal;sums.p+=e.p;sums.c+=e.c;sums.f+=e.f;sums.fib+=e.fib}});const cards=items.map(x=>`<div class="meal"><span><b>${esc(x.name||'')}</b><br><small>${x.food?(x.usable?`${x.quantity} ${esc(allFoods()[x.food].unitLabel)}`:'cantidad no utilizable — revisar manualmente'):'sin coincidencia en la base'}</small></span><b>${x.confidence?Math.round(x.confidence*100)+'%':''}</b></div>`).join('');const unusable=items.filter(x=>!x.usable).length;window._nfPendingAI={items,type:data.meal_type||'Almuerzo'};openModal({title:'🔎 Revisá antes de guardar',body:`<p class="muted small">${esc(original)}</p>${cards}<div class="card"><b>Estimación calculada solo con cantidades utilizables</b><p>${Math.round(sums.kcal)} kcal · P ${Math.round(sums.p)} g · C ${Math.round(sums.c)} g · G ${Math.round(sums.f)} g · Fibra ${Math.round(sums.fib)} g</p></div>${unusable?`<div class="notice">${unusable} alimento(s) requieren revisión manual porque no hay una cantidad/unidad utilizable o no coincidieron con la base.</div>`:''}<div class="actions"><button onclick="savePendingAIItems()">Guardar utilizables</button><button class="secondary" onclick="closeModal();window._nfPendingAI=null">Cancelar</button></div>`})}
function savePendingAIItems(){const p=window._nfPendingAI;if(!p)return;window._nfPendingAI=null;saveAIItems(p.items,p.type)}
function saveAIItems(items,type){let saved=0;for(const x of (items||[])){if(!x.food)continue;const f=allFoods()[x.food];const qty=f?.unitMode==='portion'?Number(x.quantity||x.portions):Number(x.grams);if(!f||!Number.isFinite(qty)||qty<=0||qty>10000)continue;const entry=calcEntryFromFood(x.food,qty,{pid:getActiveProfile().id,date:window.journalDate||localDate(),type,estimate:true,confidence:Math.min(1,Math.max(0,Number(x.confidence)||0.5)),aiName:x.name,aiGrams:Number(x.grams)||null,source:'NutriIA + base local'});if(entry){db.entries.push(entry);saved++}}if(!saved)return alert('No pude guardar alimentos reconocidos con una cantidad válida. Revisalos manualmente.');if(!save()){db.entries.splice(Math.max(0,db.entries.length-saved),saved);return}closeModal();render()}

function saveProfile(){const p=getActiveProfile(),snapshot=JSON.parse(JSON.stringify(p));const name=document.getElementById('pn').value.trim();const age=Number(document.getElementById('pa').value),height=Number(document.getElementById('ph').value),goal=Number(String(document.getElementById('pg').value||'').replace(',','.')),sex=document.getElementById('ps').value;p.name=name||p.name;p.age=age;p.sex=sex;p.height=height;p.activity=document.getElementById('pactivity').value;p.goal=goal;p.objectives=[...document.querySelectorAll('.objedit:checked')].map(x=>x.value);if(!p.objectives.length)p.objectives=['food_quality'];p.goalType=objectivesToGoalCode(p.objectives);p.pattern=document.getElementById('ppattern').value;p.targetProteinMode=['highprotein','ketohighprotein'].includes(p.pattern)?'high':'normal';p.targetMode=document.getElementById('ptargetmode').value;const errs=validateProfileInputs({age:p.age,sex:p.sex,height:p.height,weight:lastWeight(p.id)});if(!Number.isFinite(p.goal)||p.goal<30||p.goal>300||errs.length){Object.assign(p,snapshot);return alert((errs.length?errs.join(' '):'Peso objetivo fuera de rango (30–300 kg).'))}const w=lastWeight(p.id);if(p.targetMode==='auto'){const auto=calcAutoTargets({age:p.age,sex:p.sex,height:p.height,weight:w,goal:p.goal,activity:p.activity,goalType:objectivesToGoalCode(p.objectives),pattern:p.pattern});if(!auto){Object.assign(p,snapshot);return alert('No se pudieron calcular los objetivos automáticamente.')}p.cal=auto.cal;p.pr=auto.pr;p.carbs=null;p.fat=null;p.fiber=autoFiberTarget(auto.cal,p.pattern);p.water=autoWaterTarget(w,p.sex);p.calSource=auto.method;p.prSource=`automático: ${auto.proteinFactor} g/kg sobre ${auto.proteinReferenceWeight} kg`;}else{const pc=Number(document.getElementById('pc').value),pp=Number(document.getElementById('pp').value),pcc=Number(document.getElementById('pcc').value),pf=Number(document.getElementById('pfat').value),fib=Number(document.getElementById('pfib').value);if(!(pc>=1300&&pc<=5000&&pp>0&&pp<=400&&pcc>=0&&pcc<=600&&pf>0&&pf<=250&&fib>=0&&fib<=100)){Object.assign(p,snapshot);return alert('Revisá los objetivos avanzados. Los valores deben estar dentro de rangos válidos; la fibra no puede ser negativa. 25 g/día es una referencia general para mayores de 10 años, no una prescripción universal.')}const kcalFromMacros=pp*4+pcc*4+pf*9;if(Math.abs(kcalFromMacros-pc)>25){Object.assign(p,snapshot);return alert(`Los macros no cierran con las calorías. Diferencia: ${Math.round(kcalFromMacros-pc)} kcal.`)}p.cal=pc;p.pr=pp;p.carbs=pcc;p.fat=pf;p.fiber=fib;p.calSource='manual';p.prSource='manual';}p.targetUpdatedAt=new Date().toISOString();p.allergies=document.getElementById('pallergies').value.split(',').map(x=>x.trim()).filter(Boolean);p.dislikes=document.getElementById('pdislikes').value.split(',').map(x=>x.trim()).filter(Boolean);if(!save()){Object.assign(p,snapshot);return}render();alert('Guardado')}
function saveStepsToday(value){const p=getActiveProfile();if(!p)return;const n=Number(String(value??'').replace(',','.'));if(!Number.isFinite(n)||n<0||n>50000)return alert('Los pasos deben estar entre 0 y 50.000.');const key=`${p.id}|${localDate()}`,old=db.stepsByDate[key]||0;db.stepsByDate[key]=Math.round(n);if(!save()){db.stepsByDate[key]=old;return}render()}

function evidencePanel(){return `<div class="card"><h2>🔬 Base científica</h2><p class="muted small">La app separa datos de composición alimentaria, referencias poblacionales y estimaciones internas. Un dato nutricional ausente nunca se interpreta como cero.</p><div class="tag">SARA 2 🇦🇷</div><div class="tag">USDA FoodData Central 🇺🇸</div><div class="tag">ANSES-Ciqual 2025 🇫🇷</div><div class="tag">BEDCA/AESAN 🇪🇸</div><div class="tag">GAPA 🇦🇷</div><div class="tag">OMS — guía vigente</div><div class="tag">EFSA</div><p class="small"><b>Referencias:</b> ≥400 g/día de frutas y verduras y ≥25 g/día de fibra natural en mayores de 10 años; para la población general, carbohidratos ~45–75% y grasas totales &lt;30% de la energía; sodio &lt;2 g/día; azúcares libres &lt;10% de energía; grasas saturadas &lt;10% y grasas trans &lt;1%. Los planes bajos en hidratos se tratan como configuraciones específicas y no como recomendación universal. EFSA establece referencias de agua total de 2,0 L/día para mujeres y 2,5 L/día para hombres en condiciones moderadas.</p><p class="small muted"><b>Política de fuentes:</b> se prioriza la coincidencia exacta de alimento, preparación y unidad; SARA 2 conserva prioridad cuando es el mejor match argentino, mientras que USDA FoodData Central Foundation Foods puede sustituirlo cuando existe un match analítico más específico y actualizado. ANSES-Ciqual 2025 y BEDCA/AESAN se usan como comparadores secundarios. Sin evidencia suficiente, el dato permanece provisional y no se inventa.</p><p class="small muted">Mifflin–St Jeor se usa como ecuación de estimación del gasto energético en reposo. La proteína se expresa como rango configurable y factor objetivo interno; no es una recomendación clínica universal. Los objetivos de energía, proteína y el ajuste por tendencia de peso son estimaciones/configuraciones internas y no mediciones metabólicas ni prescripciones clínicas.</p></div>`}
function weeklyTrend(pid){const ds=days(28), vals=ds.map(d=>({date:d,kg:trendWeightAt(d,pid)})).filter(x=>x.kg!=null);if(vals.length<4)return null;const n=vals.length,xs=vals.map((_,i)=>i),ys=vals.map(x=>x.kg),mx=(n-1)/2,my=ys.reduce((a,b)=>a+b,0)/n;let num=0,den=0;for(let i=0;i<n;i++){num+=(xs[i]-mx)*(ys[i]-my);den+=(xs[i]-mx)**2}const slope=den?num/den:0;return {slopePerDay:slope,weeklyKg:slope*7,start:ys[0],end:ys[ys.length-1],n};}
function coachSummary(p){const st=weekStats(p.id),tg=targets(p),ad=safeAdaptiveTargets(p),wt=weeklyTrend(p.id),msgs=[];if(!st.daysWithFood)return {status:'sin_datos',title:'Necesito más registros',msgs:['Registrá la mayoría de tus comidas para que el análisis sea confiable.']};if(st.daysWithFood<4)msgs.push('Hay pocos días registrados esta semana; tomá las conclusiones como preliminares.');if(ad)msgs.push(`Gasto energético estimado: ~${ad.expenditure} kcal/día (${ad.confidence}).`);if(wt){const s=wt.weeklyKg;if(Math.abs(s)<.1)msgs.push('La tendencia de peso está prácticamente estable.');else msgs.push(`La tendencia es ${s<0?'descendente':'ascendente'} (~${Math.abs(s).toFixed(2)} kg/semana).`);}if(st.avgProtein<targetProtein(p)*.85)msgs.push(`Proteína media ${Math.round(st.avgProtein)} g/día: conviene acercarse al objetivo de ${Math.round(targetProtein(p))} g.`);const t7=totals(localDate(),p.id);if(t7.sodium>tg.sodium)msgs.push('Hoy el sodio supera el límite configurado; revisá alimentos procesados y agregados de sal.');return {status:'ok',title:'Lectura de la semana',msgs};}
function mealSuggestions(p){const t=totals(),tg=targets(p),rc=Math.max(0,tg.cal-t.kcal),rp=Math.max(0,targetProtein(p)-t.p),a=[];const add=(food,title,desc,qty)=>{if(!patternCompatible(food,p))return;const e=calcEntryFromFood(food,qty,{pid:p.id,date:localDate(),estimate:true,confidence:.7,source:'Sugerencia basada en base local'});if(e)a.push([title,desc,Math.round(e.kcal),Math.round(e.p)])};if(rc>250||rp>20)add('Pechuga de pollo','🍗 Pollo + ensalada','Idea: una porción de pechuga de pollo junto con verduras.',120);if(rc>200||rp>15)add('Huevo hervido','🥚 Huevo + verduras','Idea: huevo hervido junto con verduras.',100);if(rc>150||rp>20)add('Atún al natural','🐟 Atún + verduras','Idea: atún al natural junto con verduras.',100);if(rc>120)add('Yogur natural','🥛 Yogur natural','Idea: yogur natural; la fruta puede agregarse por separado.',150);return a.slice(0,3)}
function smartAdvice(p,st){const tg=targets(p),op=objectiveProfile(p),out=[];if(op.conflicts.length)out.push('Hay objetivos que compiten entre sí; elegí una prioridad principal o usá un objetivo combinado.');if(st.daysWithFood===0){out.push('Empezá registrando las comidas: la aplicación necesita datos reales para analizar tendencias.');return out}if(op.mode==='fat_loss'||op.mode==='recomp'){if(st.avgKcal>tg.cal*1.08)out.push('El promedio energético está por encima del objetivo; revisá porciones y extras calóricos.');else if(st.avgKcal<tg.cal*.75)out.push('El promedio energético está bastante bajo; evitá déficits extremos.');else out.push('El promedio energético está razonablemente alineado con el objetivo.')}if(op.mode==='muscle'||op.mode==='recomp'){if(st.avgProtein<targetProtein(p)*.85)out.push('La proteína promedio está por debajo del objetivo; distribuí fuentes proteicas en las comidas.');else out.push('La proteína promedio está bien encaminada para el objetivo.')}if(op.ids.includes('glycemic')){if(st.avgCarbs>tg.carbs*1.1)out.push('El promedio de hidratos supera el objetivo configurado; priorizá fibra y fuentes menos refinadas.');else out.push('El promedio de hidratos está dentro del rango configurado.')}if(op.ids.includes('cardiovascular'))out.push('Revisá especialmente sodio, grasas saturadas y calidad de grasas.');if(op.ids.includes('food_quality')||op.ids.includes('longevity'))out.push('Priorizá variedad vegetal, legumbres, frutos secos, pescado y alimentos mínimamente procesados.');if(st.avgSteps<tg.steps*.75)out.push('La actividad está por debajo del objetivo; aumentala gradualmente si es apropiado.');return out}
