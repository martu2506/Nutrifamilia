function objectiveLabel(id){return OBJECTIVES[id]?.label||id}
function getObjectives(p){let ids=Array.isArray(p.objectives)&&p.objectives.length?p.objectives:[p.goalType==='Bajar peso'?'lose_fat':'food_quality'];return ids.filter(id=>OBJECTIVES[id])}
function compatibleObjectives(ids){const out=[];for(const a of ids){for(const b of ids){if(a===b)continue;if(!OBJECTIVE_COMPAT[a]?.has(b))out.push([a,b]);}}return out.filter((x,i)=>out.findIndex(y=>y[0]===x[1]&&y[1]===x[0])<i)}
function objectiveProfile(p){const ids=getObjectives(p),conflicts=compatibleObjectives(ids);const has=id=>ids.includes(id);let mode='general';if(has('recomp')||(has('lose_fat')&&has('gain_muscle')))mode='recomp';else if(has('gain_muscle'))mode='muscle';else if(has('lose_fat'))mode='fat_loss';else if(has('maintain'))mode='maintenance';return {ids,conflicts,mode,labels:ids.map(objectiveLabel)}}

function ensureFamilyModel(x){
  x.familyVersion=2;
  x.familyName=x.familyName||'Mi familia';
  x.profiles=Array.isArray(x.profiles)?x.profiles:[];
  x.profiles.forEach((p,i)=>{
    p.id=String(p.id||('person_'+Date.now()+'_'+i));
    p.name=String(p.name||`Persona ${i+1}`);
    p.role=p.role||'familiar';
    p.permissions=p.permissions||{canEdit:true,canDelete:true};
    p.objectives=getObjectives(p);
  });
  if(!x.active&&x.profiles[0])x.active=x.profiles[0].id;
  return x;
}

function normalize(x){
 x=ensureFamilyModel(x);
 x.profiles=x.profiles||[];x.entries=x.entries||[];x.weights=x.weights||[];x.customFoods=x.customFoods||[];x.recipes=x.recipes||[];x.photoLogs=x.photoLogs||[];x.glucoseLogs=x.glucoseLogs||[];x.healthLogs=x.healthLogs||[];
 x.waterByDate=x.waterByDate||{};x.stepsByDate=x.stepsByDate||{};x.sleepByDate=x.sleepByDate||{};x.ai=x.ai||{enabled:false,model:'gpt-5.6-luna',apiKey:'',endpoint:'https://api.openai.com/v1/responses'};x.glucoseLogs=x.glucoseLogs||[];x.healthLogs=x.healthLogs||[];
 if(x.water && !Object.keys(x.waterByDate).length){const pid=x.active||x.profiles?.[0]?.id;if(pid)x.waterByDate[`${pid}|${localDate()}`]=x.water;}
 if(x.steps && !Object.keys(x.stepsByDate).length){const pid=x.active||x.profiles?.[0]?.id;if(pid)x.stepsByDate[`${pid}|${localDate()}`]=x.steps;}
 x.profiles.forEach(p=>{p.objectives=getObjectives(p);p.goalType=p.goalType||objectiveLabel(p.objectives[0]);p.pattern=p.pattern||'balanced';p.cal=Number(p.cal)||1900;p.pr=Number(p.pr)||120;p.water=Number(p.water)||2000;p.steps=Number(p.steps)||8000;p.goal=Number(p.goal)||null;p.allergies=Array.isArray(p.allergies)?p.allergies:[];p.dislikes=Array.isArray(p.dislikes)?p.dislikes:[];});

function calcEntryFromFood(foodName,grams,base={}){const f=allFoods()[foodName];if(!f)return null;const g=Math.max(0,Number(grams)||0),fac=g/100;const out={...base,food:foodName,grams:g,qty:g,kcal:(f.kcal||0)*fac,p:(f.p||0)*fac,c:(f.c||0)*fac,f:(f.f||0)*fac,fib:(f.fib||0)*fac,sugar:(f.sugar||0)*fac,sat:(f.sat||0)*fac,sodium:(f.sodium||0)*fac,veg:(f.veg||0)*fac,fruit:(f.fruit||0)*fac,source:f.source||'Base local provisoria',sourceStatus:f.sourceStatus||'pendiente de validación SARA 2',estimate:!!base.estimate};NUTRIENT_FIELDS.slice(8).forEach(k=>out[k]=(f[k]||0)*fac);if(f.plant){out.plantCount=1;out.plantKey=f.plantKey||foodName.toLowerCase()}return out}

function saveMeal(){const grams=Number(document.getElementById('qty').value),name=document.getElementById('food').value;if(!grams||grams<=0)return alert('Ingresá una cantidad válida.');const e=calcEntryFromFood(name,grams,{pid:profile().id,date:window.journalDate||localDate(),type:document.getElementById('type').value});if(!e)return alert('Alimento no encontrado.');db.entries.push(e);save();closeModal();render()}
function dayQuality(p,date=localDate()){
 const t=totals(date,p.id),tg=targets(p);
 let score=50;
 if(t.kcal>0){if(t.kcal<=tg.cal*1.05)score+=8;if(t.kcal<tg.cal*.75)score-=8}
 if(t.p>= (p.pr||120)*.8)score+=10;
 if(t.fib>=tg.fiber)score+=8;
 if(t.sodium<=tg.sodium)score+=4;
 if(t.sat<=tg.sat)score+=4;
 if(t.carbs<=tg.carbs)score+=6;
 if(t.plantCount>=3)score+=6;
 if((db.stepsByDate[`${p.id}|${date}`]||0)>=tg.steps*.75)score+=4;
 if((db.waterByDate[`${p.id}|${date}`]||0)>=tg.water*.75)score+=4;
 if(p.pattern==='mediterranean'||p.pattern==='medlowcarb'||p.pattern==='longevity'){if(t.f>=1)score+=3}
 if(t.ultraCount>0)score-=Math.min(10,t.ultraCount*2);
 return Math.max(0,Math.min(100,Math.round(score)));
}

 if(p.dislikes && p.dislikes.some(a=>a && name.toLowerCase().includes(a.toLowerCase()))) return false;
 return true;
}

function nutritionScore(p,date=localDate()){const t=totals(date,p.id),tg=targets(p);const fit=(v,t)=>t?Math.max(0,1-Math.abs(v-t)/t):0;const under=(v,t)=>t?Math.min(1,v/t):0;const limit=(v,t)=>t?Math.max(0,1-Math.max(0,v-t)/t):1;const components={calorias:fit(t.kcal,tg.cal),proteina:under(t.p,p.pr||120),fibra:under(t.fib,tg.fiber),verduras:under(t.veg,tg.veg),sodio:limit(t.sodium,tg.sodium),saturadas:limit(t.sat,tg.sat)};const score=Math.round(100*(.20*components.calorias+.20*components.proteina+.20*components.fibra+.15*components.verduras+.15*components.sodio+.10*components.saturadas));return {score:Math.max(0,Math.min(100,score)),components}}

function resolveFood(name){let fs=allFoods(),keys=Object.keys(fs),n=(name||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').trim();const aliases={'palta':'Palta','aguacate':'Palta','huevo duro':'Huevo hervido','huevo cocido':'Huevo hervido','pollo grillado':'Pollo a la plancha','pollo a la parrilla':'Pollo a la plancha','bife':'Bife de vaca','carne vacuna':'Bife de vaca','fideos':'Pasta cocida','tallarines':'Pasta cocida','zapallito':'Zapallito verde','zucchini':'Zapallito verde','morron':'Pimiento rojo'};if(aliases[n]&&fs[aliases[n]])return aliases[n];let best=keys.find(k=>k.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'')===n);if(best)return best;let toks=n.split(/\s+/).filter(x=>x.length>2);return keys.find(k=>{let kk=k.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'');return kk.includes(n)||n.includes(kk)||toks.every(t=>kk.includes(t))})||null}
function showAIResult(data,original){let items=(data.items||[]).map(x=>{let food=resolveFood(x.name);return {...x,food,grams:Number(x.grams)||100}});let known=items.filter(x=>x.food);let sums={kcal:0,p:0,c:0,f:0,fib:0,sugar:0,sat:0,sodium:0,calcium:0,iron:0,magnesium:0,potassium:0,vitC:0,vitD:0,vitE:0,b12:0,folate:0,omega3:0,zinc:0,phosphorus:0,iodine:0,cholesterol:0};known.forEach(x=>{let f=allFoods()[x.food],fac=x.grams/100;Object.keys(sums).forEach(k=>sums[k]+=(f[k]||0)*fac)});let cards=items.map((x,i)=>`<div class="meal"><span><b>${esc(x.name)}</b><br><small>${x.grams} g ${x.food?'· '+esc(x.food):'· sin coincidencia en la base'}</small></span><b>${x.confidence?Math.round(x.confidence*100)+'%':''}</b></div>`).join('');let unknown=items.filter(x=>!x.food).length;modal({title:'🔎 Revisá antes de guardar',body:`<p class="muted small">${esc(original)}</p>${cards}<div class="card"><b>Estimación calculada con la base local</b><p>${Math.round(sums.kcal)} kcal · P ${Math.round(sums.p)} g · C ${Math.round(sums.c)} g · G ${Math.round(sums.f)} g · Fibra ${Math.round(sums.fib)} g</p><small class="muted">Micros: Ca ${Math.round(sums.calcium)} mg · Fe ${Math.round(sums.iron)} mg · Mg ${Math.round(sums.magnesium)} mg · K ${Math.round(sums.potassium)} mg · C ${Math.round(sums.vitC)} mg · D ${Math.round(sums.vitD)} µg · B12 ${Math.round(sums.b12*10)/10} µg · omega-3 ${Math.round(sums.omega3*10)/10} g</small></div>${unknown?`<div class="notice">${unknown} alimento(s) no coincidieron con la base. Agregalos manualmente para mejorar la precisión.</div>`:''}<div class="actions"><button onclick='saveAIItems(${JSON.stringify(items).replace(/</g,'\\u003c')},${JSON.stringify(data.meal_type||'Almuerzo')})'>Guardar</button><button class="secondary" onclick="closeModal()">Cancelar</button></div>`})}

function editWeight(date){const w=db.weights.find(x=>x.pid===profile().id&&x.date===date);if(!w)return;modal({title:'Editar peso',body:`<label>Peso (kg)</label><input id="ewkg" type="number" step=".1" value="${w.kg}"><button onclick="saveEditWeight('${date}')">Guardar</button>`})}

function deleteWeight(date){if(!confirm('¿Eliminar este registro de peso?'))return;db.weights=db.weights.filter(x=>!(x.pid===profile().id&&x.date===date));save();render()}
function analyzePhoto(file){if(!file)return;if(!aiConfigured())return alert('Configurá NutriIA antes de analizar fotos.');const reader=new FileReader();reader.onload=async()=>{try{modal({title:'📷 Analizando foto…',body:'<div class="empty">Identificando alimentos y cantidades aproximadas…</div>'});const prompt='Analizá esta foto de comida. Devolvé SOLO JSON válido: {"items":[{"name":"nombre simple del alimento","grams":100,"unit":"g","confidence":0.8}],"meal_type":"Almuerzo","notes":""}. No inventes ingredientes ocultos. Si una cantidad no puede estimarse razonablemente, usá un rango central aproximado y confidence baja.';const raw=await callAI(prompt,reader.result);const json=JSON.parse(raw.replace(/```json|```/g,'').trim());if(!Array.isArray(json.items))throw new Error('La IA no devolvió alimentos válidos.');json.items=json.items.map(x=>({...x,confidence:Math.min(1,Math.max(0,Number(x.confidence)||0.4))}));showAIResult(json,'Foto de comida')}catch(e){modal({title:'📷 No pude analizar',body:`<div class="notice">${esc(e.message)}</div><button onclick="closeModal()">Cerrar</button>`})}};reader.readAsDataURL(file)}


function mealSuggestions(p){const t=totals(),cal=p.cal||1900,pr=p.pr||120,rc=Math.max(0,cal-t.kcal),rp=Math.max(0,pr-t.p),tg=targets(p),a=[];const add=(food,title,desc,k,prot)=>{if(patternCompatible(food,p))a.push([title,desc,k,prot])};if(rc>250||rp>20)add('Pechuga de pollo','🍗 Pollo + ensalada','Pechuga de pollo con verduras',330,38);if(rc>200||rp>15)add('Huevo hervido','🥚 Huevos + verduras','Huevos con tomate y palta',316,15);if(rc>150||rp>20)add('Atún al natural','🐟 Atún + verduras','Atún con rúcula, tomate y aceite',260,28);if(rc>120)add('Yogur natural','🥛 Yogur + fruta','Yogur natural con frutillas',140,8);if(p.pattern==='lowcarb'||p.pattern==='medlowcarb'||p.pattern==='verylowcarb')return a.slice(0,3);return a.slice(0,3)}
function journal(){let el=document.getElementById('journal'),p=profile(),date=window.journalDate||localDate(),arr=entriesFor(date,p.id),t=totals(date,p.id),score=nutritionScore(p,date);el.innerHTML=`<div class="card"><div class="calendarbar"><button class="secondary" onclick="changeJournalDate(-1)">‹</button><div><b>🍽️ ${date}</b><br><span class="mini">${patternLabel(p)}</span></div><button class="secondary" onclick="changeJournalDate(1)">›</button></div><div class="grid3" style="margin-top:10px"><div class="stat"><b>${Math.round(t.kcal)}</b><span>kcal</span></div><div class="stat"><b>${Math.round(t.p)}g</b><span>proteína</span></div><div class="stat"><b>${Math.round(t.c)}g</b><span>hidratos</span></div></div><div class="card" style="margin-top:10px"><div class="row"><span>🧭 Calidad nutricional</span><b class="score">${score.score}<small>/100</small></b></div><small class="muted">Indicador orientativo, transparente y no diagnóstico.</small></div><div class="actions"><button onclick="addAIMeal()">🤖 Registrar con IA</button><button class="secondary" onclick="addMeal()">+ Manual</button><button class="secondary" onclick="copyYesterday()">↪ Copiar ayer</button></div>${arr.length?arr.map((x,i)=>`<div class="meal"><div><b>${esc(x.food)}</b><br><small>${Math.round(x.grams||x.qty||0)} g · ${x.type}${x.estimate?' · estimación IA':''}</small></div><div><b>${Math.round(x.kcal)} kcal</b><br><small>P ${Math.round(x.p)} · C ${Math.round(x.c)} · G ${Math.round(x.f)} · Fib ${Math.round(x.fib||0)}g</small><br><button class="secondary small" onclick="editEntry(${i})">Editar</button> <button class="danger small" onclick="deleteEntry(${i})">Eliminar</button></div></div>`).join(''):'<div class="empty">No hay comidas registradas para esta fecha.</div>'}</div><div class="card"><h2>🌱 Variedad vegetal</h2><p class="muted">La diversidad vegetal semanal es un indicador de variedad, no una obligación médica.</p><p><b>${plantDiversity(p.id)}</b> alimentos vegetales distintos en 7 días.</p></div>`}
function changeJournalDate(delta){let d=new Date((window.journalDate||localDate())+'T12:00:00');d.setDate(d.getDate()+delta);window.journalDate=localDate(d);render()}
function progressPage(){let el=document.getElementById('progress'),p=profile(),st=weekStats(p.id),tg=targets(p),ws=weights(p.id),last=lastWeight(p.id),start=firstWeight(p.id),goal=p.goal,ad=smartAdvice(p,st),sugs=mealSuggestions(p),goalObj=objectiveProfile(p),score=Math.round(st.avgQuality);let trend='Sin suficientes pesajes';if(ws.length>=2){let a=ws.slice(-Math.min(4,ws.length)),delta=a[a.length-1].kg-a[0].kg;trend=delta<-.2?`Tendencia descendente: ${Math.abs(delta).toFixed(1)} kg en el período`:delta>.2?`Tendencia ascendente: ${delta.toFixed(1)} kg en el período`:'Tendencia estable en el período'}let goalPct=(start&&goal&&last&&start!==goal)?Math.max(0,Math.min(100,((start-last)/(start-goal))*100)):0;el.innerHTML=`<div class="card"><div class="row"><div><h2>📊 Progreso V5.5</h2><span class="pill">Últimos 7 días</span></div><span class="tag">${goalObj.mode==='recomp'?'🔄 Recomposición':patternLabel(p)}</span></div><div class="grid3"><div class="stat"><b>${Math.round(st.avgKcal)}</b><span>kcal/día</span></div><div class="stat"><b>${Math.round(st.avgProtein)} g</b><span>proteína/día</span></div><div class="stat"><b>${Math.round(st.avgSteps)}</b><span>pasos/día</span></div></div></div><div class="card"><h2>🧠 Análisis</h2>${ad.map(x=>`<div class="notice">• ${esc(x)}</div>`).join('')}</div><div class="card"><h2>⚖️ Tendencia de peso</h2><div class="big">${last?last+' kg':'—'}</div><p class="muted">${trend}</p>${goal?`<div class="bar"><i style="width:${goalPct}%"></i></div><small>Avance estimado hacia ${goal} kg: ${Math.round(goalPct)}%</small>`:''}</div><div class="card"><h2>🍽️ Sugerencias</h2>${sugs.length?sugs.map(x=>`<div class="suggest"><b>${esc(x[0])}</b><br><small>${esc(x[1])} · ~${x[2]} kcal · ~${x[3]} g proteína</small></div>`).join(''):'<div class="empty">No hay sugerencias suficientes con los datos actuales.</div>'}</div><div class="card"><h2>🧬 Micronutrientes de hoy</h2><div class="grid3"><div class="stat"><b>${Math.round(totals(localDate(),p.id).calcium||0)} mg</b><span>calcio</span></div><div class="stat"><b>${Math.round(totals(localDate(),p.id).magnesium||0)} mg</b><span>magnesio</span></div><div class="stat"><b>${Math.round((totals(localDate(),p.id).omega3||0)*1000)} mg</b><span>omega-3</span></div></div><div class="grid3"><div class="stat"><b>${Math.round(totals(localDate(),p.id).iron||0)} mg</b><span>hierro</span></div><div class="stat"><b>${Math.round(totals(localDate(),p.id).potassium||0)} mg</b><span>potasio</span></div><div class="stat"><b>${Math.round(totals(localDate(),p.id).vitC||0)} mg</b><span>vitamina C</span></div></div></div><div class="card"><h2>🇦🇷 Calidad de datos</h2><p class="muted small">Fuente primaria objetivo: SARA 2. Los alimentos sin validación individual se muestran como provisionales.</p></div>`}
function render(){if(!profile())return setup();home();journal();progressPage();weight();profilePage()}

function runSelfTest(){const R=[],ok=(n,c,d)=>R.push({n,pass:!!c,d});try{ok('Estructura',Array.isArray(db.profiles)&&Array.isArray(db.entries)&&Array.isArray(db.weights)&&Array.isArray(db.recipes),'colecciones');ok('Versión',db.version===VERSION,'versión actual');ok('Funciones críticas',typeof modal==='function'&&typeof closeModal==='function'&&typeof profilePage==='function'&&typeof newProfile==='function'&&typeof weight==='function','UI');const e=calcEntryFromFood(Object.keys(allFoods())[0],100,{pid:'TEST',date:'2099-01-01',type:'Test'});ok('Motor nutricional',!!e&&Number.isFinite(e.kcal)&&Number.isFinite(e.p),'cálculo por 100 g');ok('Recomposición',objectiveProfile({objectives:['lose_fat','gain_muscle']}).mode==='recomp','objetivos compatibles');ok('Compatibilidad',compatibleObjectives(['lose_fat','gain_muscle']).length===0,'sin conflicto');ok('Targets',Number.isFinite(targets({cal:1900,pattern:'lowcarb',objectives:['glycemic']}).carbs),'objetivo hidratos');ok('Fecha',/^\d{4}-\d{2}-\d{2}$/.test(localDate()),'fecha local');const backup=JSON.parse(JSON.stringify({profiles:db.profiles,entries:db.entries,weights:db.weights}));ok('Backup JSON',Array.isArray(backup.profiles)&&Array.isArray(backup.entries),'serializable');const pass=R.filter(x=>x.pass).length,fail=R.length-pass;document.getElementById('selftest-output').innerHTML=`<div class="card"><h3>🧪 Autoprueba V5.5</h3><p><b>${pass}/${R.length}</b> correctas · ${fail} fallos</p>${R.map(x=>`<div class="meal"><span>${x.pass?'🟢':'🔴'} <b>${esc(x.n)}</b><br><small>${esc(x.d)}</small></span><b>${x.pass?'OK':'FALLO'}</b></div>`).join('')}<p class="small muted">La autoprueba cubre lógica local. La prueba de Android, IA real y Health Connect requiere ejecución.</p></div>`}catch(e){document.getElementById('selftest-output').innerHTML=`<div class="card"><h3>🔴 Autoprueba</h3><p>${esc(e.message||e)}</p></div>`}}


function setup(){document.querySelector('#home').innerHTML=`<div class="card"><h2>🥗 NutriFamilia V5.5</h2><p class="muted">Seguimiento familiar de peso, alimentación y hábitos. Los datos quedan en este teléfono.</p><button onclick="newProfile()">+ Crear perfil</button></div>`;['journal','progress','weight','profile'].forEach(x=>document.getElementById(x).innerHTML='');document.getElementById('addBtn').classList.add('hidden')}
function pct(v,t){return Math.min(100,Math.max(0,(v/t)*100))}
function meter(label,v,t,unit='',reverse=false){let good=reverse?v<=t:v>=t;return `<div style="margin:9px 0"><div class="row"><span>${label}</span><b>${Math.round(v*10)/10} / ${t} ${unit}</b></div><div class="bar"><i style="width:${pct(v,t)}%"></i></div></div>`}
function home(){
 let p=profile(),t=totals(),cal=p.cal||1900,pr=p.pr||120,w=lastWeight(p.id),start=firstWeight(p.id),tg=targets(p);
 let diff=w&&start?(w-start).toFixed(1):'—', goal=w&&p.goal?(w-p.goal).toFixed(1):'—';
 let score=dayQuality(p), plants=plantDiversity(p.id), carbTarget=tg.carbs, net=Math.max(0,t.c-t.fib);
 document.getElementById('home').innerHTML=`<div class="card"><div class="row"><div><span class="pill">${esc(p.name)}</span><h2 style="margin-top:8px">${patternLabel(p)}</h2><small class="muted">${esc(p.goalType||'Objetivo personalizado')}</small></div><button class="secondary" onclick="switchProfile()">Cambiar</button></div>
 <div class="grid3"><div class="stat"><b>${Math.round(t.kcal)}</b><span>kcal</span></div><div class="stat"><b>${Math.round(t.p)} g</b><span>proteína</span></div><div class="stat"><b>${Math.round(t.c)} g</b><span>hidratos</span></div></div>
 ${meter('🔥 Calorías',t.kcal,cal,'kcal',true)}${meter('🥩 Proteína',t.p,pr,'g')}${meter('🌾 Hidratos',t.c,carbTarget,'g',true)}${meter('🌿 Fibra',t.fib,tg.fiber,'g')}
 <div class="row"><span>Carbohidratos netos*</span><b>${Math.round(net)} g</b></div><div class="mini">*referencia aproximada: carbohidratos totales − fibra.</div></div>
 <div class="grid"><div class="card"><b>🧠 Calidad del día</b><div class="score">${score}<small>/100</small></div><small class="muted">${smartScoreLabel(score)}</small></div>
 <div class="card"><b>🌱 Variedad vegetal</b><div class="score">${plants}</div><small class="muted">alimentos vegetales distintos en 7 días</small></div></div>
 <div class="grid"><div class="card"><b>⚖️ Peso</b><div style="font-size:25px;margin-top:5px">${w||'—'} kg</div><small class="muted">Objetivo: ${p.goal||'—'} kg</small><br><small>Desde inicio: ${diff} kg · Faltan: ${goal} kg</small></div>
 <div class="card"><b>💧 Agua</b><div style="font-size:25px;margin-top:5px">${db.waterByDate[`${p.id}|${localDate()}`]||0} ml</div><button class="secondary" onclick="addWater()">+250 ml</button></div></div>
 <div class="card"><h2>🩸 Salud metabólica</h2><div class="actions"><button class="secondary" onclick="addGlucose()">Registrar glucosa</button><button class="secondary" onclick="addHealthLog()">Otros datos</button></div>${latestGlucoseHtml(p.id)}</div><div class="card"><h2>📱 Salud del teléfono</h2><p class="muted small">Podés importar desde Health Connect pasos, peso, sueño, calorías activas y frecuencia cardíaca cuando estén disponibles y autorizados.</p><div class="actions"><button class="secondary" onclick="connectHealth()">Conectar</button><button class="secondary" onclick="syncHealth()">Sincronizar</button></div></div><div class="card"><h2>🤖 NutriIA</h2><p class="muted small">Puede analizar tus comidas, resumir el día y ayudarte a decidir qué comer, usando tu perfil y registros.</p><div class="actions"><button onclick="askAI('¿Cómo estuvo mi alimentación hoy y qué 3 cosas priorizarías?')">Analizar mi día</button><button class="secondary" onclick="openAISettings()">Configurar IA</button></div></div>
 <div class="card"><h2>📊 Calidad nutricional</h2>${meter('🥬 Frutas + verduras',t.veg,tg.veg,'g')}${meter('🧂 Sodio',t.sodium,tg.sodium,'mg',true)}${meter('🧈 Grasas saturadas',t.sat,tg.sat,'g',true)}${meter('🍬 Azúcares totales',t.sugar,tg.sugar,'g',true)}</div>
 <div class="card"><h2>🕒 Hábitos</h2><div class="grid3"><div class="stat"><b>${db.stepsByDate[`${p.id}|${localDate()}`]||0}</b><span>pasos</span></div><div class="stat"><b>${db.sleepByDate?.[`${p.id}|${localDate()}`]||'—'}</b><span>horas sueño</span></div><div class="stat"><b>${t.plantCount||0}</b><span>plantas hoy</span></div></div><div class="actions"><button class="secondary" onclick="addSleep()">Registrar sueño</button></div></div>
 <div class="card"><div class="notice">NutriFamilia usa el patrón ${patternLabel(p)} como guía de seguimiento. No es una prescripción médica.</div></div>`;
}

function latestGlucoseHtml(pid){
 let a=(db.glucoseLogs||[]).filter(x=>x.pid===pid).sort((x,y)=>x.date.localeCompare(y.date));
 if(!a.length)return '<div class="empty">Todavía no hay registros de glucosa.</div>';
 let x=a[a.length-1];return `<p><b>${x.value} mg/dL</b> · ${esc(x.context)} · ${x.date}</p><small class="muted">La app muestra datos registrados, no diagnostica.</small>`;
}
function addGlucose(){modal({title:'🩸 Registrar glucosa',body:`<label>Glucosa (mg/dL)</label><input id="gvalue" type="number" step="1"><label>Momento</label><select id="gcontext"><option>Ayunas</option><option>Antes de comer</option><option>1–2 h después</option><option>Al acostarme</option><option>Otro</option></select><button onclick="saveGlucose()">Guardar</button>`})}

function addSleep(){modal({title:'😴 Registrar sueño',body:`<label>Horas dormidas</label><input id="sleepv" type="number" step=".1" min="0" max="24"><button onclick="saveSleep()">Guardar</button>`})}

function addHealthLog(){modal({title:'🩺 Otros datos',body:`<label>Presión sistólica (opcional)</label><input id="hsys" type="number"><label>Presión diastólica (opcional)</label><input id="hdia" type="number"><label>Cintura (cm, opcional)</label><input id="hwaist" type="number" step=".1"><button onclick="saveHealthLog()">Guardar</button>`})}

function weekStats(pid=profile()?.id){let ds=days(7);let kcal=0,protein=0,carbs=0,steps=0,water=0,daysWithFood=0,quality=0;ds.forEach(d=>{let t=totals(d,pid),pp=db.profiles.find(x=>x.id===pid)||profile();kcal+=t.kcal;protein+=t.p;carbs+=t.c;steps+=db.stepsByDate[`${pid}|${d}`]||0;water+=db.waterByDate[`${pid}|${d}`]||0;quality+=dayQuality(pp,d);if(t.kcal>0)daysWithFood++});return {ds,kcal,protein,carbs,steps,water,daysWithFood,quality,avgKcal:kcal/7,avgProtein:protein/7,avgCarbs:carbs/7,avgSteps:steps/7,avgWater:water/7,avgQuality:quality/7}}
function evidencePanel(){return `<div class="card"><h2>🔬 Base científica</h2><p class="muted small">Los valores nutricionales deben conservar su fuente y estado de validación. La app no convierte estimaciones de IA en datos exactos.</p><div class="tag">SARA 2 🇦🇷</div><div class="tag">ArgenFoods 🇦🇷</div><div class="tag">GAPA 🇦🇷</div><div class="tag">OMS</div><p class="small"><b>Referencias generales:</b> ≥25 g fibra/día y ≥400 g frutas+verduras/día para mayores de 10 años; sodio &lt;2 g/día; azúcares libres &lt;10% de energía; grasas saturadas &lt;10%; grasas trans &lt;1%. Son referencias poblacionales, no objetivos médicos individuales.</p></div>`}
function smartAdvice(p,st){const tg=targets(p),op=objectiveProfile(p),out=[];if(op.conflicts.length)out.push('Hay objetivos que compiten entre sí; elegí una prioridad principal o usá un objetivo combinado.');if(st.daysWithFood===0){out.push('Empezá registrando las comidas: la aplicación necesita datos reales para analizar tendencias.');return out}if(op.mode==='fat_loss'||op.mode==='recomp'){if(st.avgKcal>tg.cal*1.08)out.push('El promedio energético está por encima del objetivo; revisá porciones y extras calóricos.');else if(st.avgKcal<tg.cal*.75)out.push('El promedio energético está bastante bajo; evitá déficits extremos.');else out.push('El promedio energético está razonablemente alineado con el objetivo.')}if(op.mode==='muscle'||op.mode==='recomp'){if(st.avgProtein<(p.pr||120)*.85)out.push('La proteína promedio está por debajo del objetivo; distribuí fuentes proteicas en las comidas.');else out.push('La proteína promedio está bien encaminada para el objetivo.')}if(op.ids.includes('glycemic')){if(st.avgCarbs>tg.carbs*1.1)out.push('El promedio de hidratos supera el objetivo configurado; priorizá fibra y fuentes menos refinadas.');else out.push('El promedio de hidratos está dentro del rango configurado.')}if(op.ids.includes('cardiovascular'))out.push('Revisá especialmente sodio, grasas saturadas y calidad de grasas.');if(op.ids.includes('food_quality')||op.ids.includes('longevity'))out.push('Priorizá variedad vegetal, legumbres, frutos secos, pescado y alimentos mínimamente procesados.');if(st.avgSteps<tg.steps*.75)out.push('La actividad está por debajo del objetivo; aumentala gradualmente si es apropiado.');return out}

function editEntry(i){let p=profile(),date=window.journalDate||localDate(),arr=entriesFor(date,p.id),x=arr[i];if(!x)return;let names=Object.keys(allFoods()).sort((a,b)=>a.localeCompare(b));modal({title:'Editar comida',body:`<label>Comida</label><select id="efood">${names.map(n=>`<option ${n===x.food?'selected':''}>${esc(n)}</option>`).join('')}</select><label>Cantidad</label><input id="eqty" type="number" value="${x.grams||x.qty||100}" step="1"><label>Momento</label><select id="etype">${['Desayuno','Almuerzo','Merienda','Cena','Snack'].map(n=>`<option ${n===x.type?'selected':''}>${n}</option>`).join('')}</select><button onclick="saveEditEntry(${i})">Guardar cambios</button>`})}
function saveEditEntry(i){const p=profile(),date=window.journalDate||localDate(),arr=entriesFor(date,p.id),old=arr[i],idx=db.entries.indexOf(old);if(idx<0)return;const name=document.getElementById('efood').value,qty=Number(document.getElementById('eqty').value)||100;const entry=calcEntryFromFood(name,qty,{pid:p.id,date,type:document.getElementById('etype').value,id:db.entries[idx].id});if(!entry)return alert('No pude recalcular ese alimento.');db.entries[idx]=entry;save();closeModal();render()}
function addWater(){let p=profile(),d=localDate();db.waterByDate[`${p.id}|${d}`]=(db.waterByDate[`${p.id}|${d}`]||0)+250; save();render()}
function copyYesterday(){let y=new Date();y.setDate(y.getDate()-1);let arr=entriesFor(localDate(y));if(!arr.length)return alert('No hay comidas registradas ayer.');arr.forEach(x=>db.entries.push({...x,date:localDate()}));save();render()}
function newRecipe(){modal({title:'Nueva receta',body:`<label>Nombre</label><input id="rname" placeholder="Ej. Pollo con zapallitos"><label>Porciones que rinde</label><input id="rport" type="number" value="4" step="1"><p class="muted small">Para esta primera versión, agregá ingredientes desde el selector.</p><div id="rrows"></div><button class="secondary" onclick="addRecipeRow()">+ Ingrediente</button><button onclick="saveRecipe()">Guardar receta</button>`});addRecipeRow()}
function addRecipeRow(){let box=document.getElementById('rrows'),names=Object.keys(allFoods());let row=document.createElement('div');row.className='card';row.innerHTML=`<select class="ri">${names.map(x=>`<option>${esc(x)}</option>`).join('')}</select><label>Cantidad (gramos)</label><input class="rq" type="number" value="100" min="1" step="1">`;box.appendChild(row)}
function saveRecipe(){let name=document.getElementById('rname').value.trim(),port=+document.getElementById('rport').value||1;if(!name)return;let rows=[...document.querySelectorAll('#rrows .card')],ing=rows.map(r=>({food:r.querySelector('.ri').value,q:+r.querySelector('.rq').value||1}));let keys=['kcal','p','c','f','fib','sugar','sat','sodium','veg','fruit','plantCount','wholeFoodCount','ultraCount','calcium','iron','magnesium','potassium','vitC','vitD','vitE','b12','folate','omega3','omega6','zinc','phosphorus','iodine','cholesterol'];let sum=Object.fromEntries(keys.map(k=>[k,0]));ing.forEach(i=>{let f=allFoods()[i.food];if(!f)return;keys.forEach(k=>sum[k]+=(f[k]||0)*(i.q/100));if(f.plant)sum.plantCount+=1;});db.recipes.push({id:Date.now().toString(),name,portions:port,ingredients:ing,...sum});save();closeModal();render()}
function useRecipe(id){let r=db.recipes.find(x=>x.id===id);if(!r)return;modal({title:`Usar: ${esc(r.name)}`,body:`<p class="muted">La receta tiene ${r.portions} porciones.</p><label>Porciones consumidas</label><input id="rqty" type="number" value="1" step=".25"><label>Momento</label><select id="rtype"><option>Almuerzo</option><option>Cena</option><option>Desayuno</option><option>Merienda</option><option>Snack</option></select><button onclick="saveRecipeMeal('${r.id}')">Registrar</button>`})}
function saveRecipeMeal(id){let r=db.recipes.find(x=>x.id===id),q=+document.getElementById('rqty').value||1,fac=q/r.portions;if(!r)return;let keys=['kcal','p','c','f','fib','sugar','sat','sodium','veg','fruit','plantCount','wholeFoodCount','ultraCount','calcium','iron','magnesium','potassium','vitC','vitD','vitE','b12','folate','omega3','omega6','zinc','phosphorus','iodine','cholesterol'];let entry={pid:profile().id,date:localDate(),food:r.name,qty:q,type:document.getElementById('rtype').value};keys.forEach(k=>entry[k]=(r[k]||0)*fac);db.entries.push(entry);save();closeModal();render()}
function exportData(){let backup={appVersion:VERSION,exportedAt:new Date().toISOString(),nutritionEngine:NUTRITION_ENGINE,data:db};let b=new Blob([JSON.stringify(backup,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=`NutriFamilia_backup_${localDate()}.json`;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),500)}
function importData(e){let file=e.target.files[0];if(!file)return;let r=new FileReader();r.onload=()=>{try{let raw=JSON.parse(r.result),x=raw.data||raw;if(!x.profiles||!Array.isArray(x.entries))throw Error();if(!confirm('Esto reemplazará los datos actuales. ¿Continuar?'))return;db=normalize(x);save();render();alert('Copia restaurada correctamente.')}catch(_){alert('La copia no es válida.')}};r.readAsText(file)}
document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tabs button').forEach(x=>x.classList.remove('active'));b.classList.add('active');['home','journal','progress','weight','profile'].forEach(id=>document.getElementById(id).classList.toggle('hidden',id!==b.dataset.tab));document.getElementById('addBtn').classList.toggle('hidden',b.dataset.tab!=='journal')});
document.querySelector('[data-tab=home]').classList.add('active');document.getElementById('addBtn').onclick=addMeal;if('serviceWorker' in navigator) navigator.serviceWorker.register('./sw.js').catch(()=>{});render();
</script>
</body></html>
